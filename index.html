
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>KASIR TOKO DEACA</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
*{box-sizing:border-box}
body{font-family:Poppins,sans-serif;margin:0;background:#f4f6fb}
header{background:#4f46e5;color:white;padding:15px;text-align:center}
.container{max-width:950px;margin:auto;padding:20px}
.card{background:white;padding:20px;border-radius:12px;box-shadow:0 10px 20px #0001;margin-bottom:20px}
input,select{padding:8px;border-radius:6px;border:1px solid #ccc;margin:3px;font-family:inherit}
button{padding:8px 12px;border:none;border-radius:6px;background:#4f46e5;color:white;margin:3px;cursor:pointer}
button:hover{background:#3730a3}
.product{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:5px;padding:10px;background:#f1f1f1;margin:6px 0;border-radius:8px}
.product input{width:90px}
.product select{width:105px}
.total{font-size:22px;font-weight:600;margin-top:15px}
.hidden{display:none}
.struk{width:230px;margin:auto;background:white;padding:10px;font-family:monospace;font-size:12px;overflow-wrap:anywhere}
.struk-item{display:flex;justify-content:space-between;gap:8px;margin:4px 0}
.line{border-top:1px dashed black;margin:8px 0}
.center{text-align:center}
.small{font-size:12px;color:#666}
.danger{background:#dc2626}
@media(max-width:600px){
.container{padding:10px}
.card{padding:14px}
.product{align-items:flex-start}
}
@media print{
@page{size:58mm auto;margin:0}
body *{visibility:hidden}
.struk,.struk *{visibility:visible}
.struk{position:absolute;left:0;top:0;width:58mm;margin:0}
}
</style>
</head>

<body>

<header>
<h1>🏪 TOKO DEACA</h1>
</header>

<div class="container" id="kasirPage">

<div class="card">
<h3>➕ Tambah Barang</h3>

<input id="nama" placeholder="Nama barang">
<input id="harga" type="number" min="0" placeholder="Harga per satuan">
<input id="qty" type="number" min="0.01" step="any" placeholder="Jumlah">

<select id="satuan">
<option value="Pcs">Pcs</option>
<option value="Renteng">Renteng</option>
<option value="Kg">Kg</option>
<option value="Sachet">Sachet</option>
<option value="Dus">Dus</option>
</select>

<button onclick="tambah()">Tambah</button>

<p class="small">Contoh jumlah: 1 Renteng, 2 Dus, 0.25 Kg, atau 3 Pcs.</p>
</div>

<div class="card">
<h3>🛒 Keranjang</h3>
<div id="list"></div>

<div class="total">Total: Rp <span id="total">0</span></div>

<br>
<button onclick="buatStruk()">Struk</button>
<button onclick="simpanTransaksi()">Simpan</button>
<button onclick="lihatHistory()">History</button>
<button class="danger" onclick="resetKeranjang()">Kosongkan</button>
</div>
</div>

<!-- STRUK -->
<div id="strukPage" class="hidden">
<div class="struk" id="areaStruk">

<div class="center"><b>TOKO DEACA</b></div>
<div class="center" id="tanggal"></div>

<div class="line"></div>
<div id="strukList"></div>

<div class="line"></div>
<div class="struk-item">
<b>TOTAL</b>
<b>Rp <span id="strukTotal"></span></b>
</div>

<div class="line"></div>
<div class="center">Terima Kasih 🙏</div>
</div>

<br>
<div class="center">
<button onclick="window.print()">Print</button>
<button onclick="downloadStruk()">PNG</button>
<button onclick="kembali()">Kembali</button>
</div>
</div>

<!-- HISTORY -->
<div id="historyPage" class="hidden">
<div class="container">
<div class="card">
<h3>📜 History Transaksi</h3>
<div id="historyList"></div>
<button onclick="kembali()">Kembali</button>
</div>
</div>
</div>

<script>
let total = 0;
let products = [];

const satuanList = ["Pcs","Renteng","Kg","Sachet","Dus"];

function rupiah(angka){
    return Math.round(angka).toLocaleString("id-ID");
}

// TAMBAH BARANG
function tambah(){
    const nama = document.getElementById("nama").value.trim();
    const hargaText = document.getElementById("harga").value;
    const qtyText = document.getElementById("qty").value;
    const harga = Number(hargaText);
    const qty = Number(qtyText);
    const satuan = document.getElementById("satuan").value;

    if(!nama || hargaText === "" || qtyText === "" ||
       !Number.isFinite(harga) || harga < 0 ||
       !Number.isFinite(qty) || qty <= 0){
        alert("Isi nama, harga, dan jumlah dengan benar!");
        return;
    }

    products.push({
        nama,
        harga,
        qty,
        satuan,
        subtotal: Math.round(harga * qty)
    });

    hitungTotal();
    updateKeranjang();

    document.getElementById("nama").value = "";
    document.getElementById("harga").value = "";
    document.getElementById("qty").value = "";
    document.getElementById("nama").focus();
}

// UPDATE KERANJANG
function updateKeranjang(){
    const list = document.getElementById("list");
    list.innerHTML = "";

    products.forEach((p,i) => {
        const div = document.createElement("div");
        div.className = "product";

        const nama = document.createElement("strong");
        nama.textContent = p.nama;

        const qty = document.createElement("input");
        qty.type = "number";
        qty.min = "0.01";
        qty.step = "any";
        qty.value = p.qty;
        qty.title = "Jumlah";
        qty.onchange = () => editItem(i,qty.value,"qty");

        const harga = document.createElement("input");
        harga.type = "number";
        harga.min = "0";
        harga.value = p.harga;
        harga.title = "Harga per satuan";
        harga.onchange = () => editItem(i,harga.value,"harga");

        const satuan = document.createElement("select");
        satuanList.forEach(s => {
            const option = document.createElement("option");
            option.value = s;
            option.textContent = s;
            satuan.appendChild(option);
        });

        satuan.value = p.satuan;
        satuan.onchange = () => editItem(i,satuan.value,"satuan");

        const subtotal = document.createElement("strong");
        subtotal.textContent = "Rp " + rupiah(p.subtotal);

        const hapus = document.createElement("button");
        hapus.textContent = "X";
        hapus.className = "danger";
        hapus.onclick = () => hapusItem(i);

        const info = document.createElement("div");
        info.style.width = "100%";
        info.className = "small";
        info.textContent = p.qty + " " + p.satuan +
            " × Rp " + rupiah(p.harga);

        div.append(nama,qty,satuan,harga,subtotal,info, hapus);
        list.appendChild(div);
    });

    hitungTotal();
}

// EDIT BARANG
function editItem(i,val,type){
    if(val === "") return;

    if(type === "satuan"){
        products[i].satuan = val;
    }else{
        const angka = Number(val);

        if(!Number.isFinite(angka) || angka < 0 ||
           (type === "qty" && angka === 0)){
            alert("Nilai tidak valid!");
            updateKeranjang();
            return;
        }

        if(type === "qty") products[i].qty = angka;
        if(type === "harga") products[i].harga = angka;
    }

    products[i].subtotal = Math.round(
        products[i].qty * products[i].harga
    );

    hitungTotal();
    updateKeranjang();
}

// HAPUS BARANG
function hapusItem(i){
    products.splice(i,1);
    hitungTotal();
    updateKeranjang();
}

// KOSONGKAN KERANJANG
function resetKeranjang(){
    if(products.length === 0) return;

    if(confirm("Kosongkan semua barang di keranjang?")){
        products = [];
        hitungTotal();
        updateKeranjang();
    }
}

// HITUNG TOTAL
function hitungTotal(){
    total = products.reduce((sum,p) => sum + p.subtotal,0);
    document.getElementById("total").textContent = rupiah(total);
}

// BUAT STRUK
function buatStruk(){
    if(products.length === 0){
        alert("Keranjang masih kosong!");
        return;
    }

    document.getElementById("kasirPage").classList.add("hidden");
    document.getElementById("historyPage").classList.add("hidden");
    document.getElementById("strukPage").classList.remove("hidden");

    document.getElementById("tanggal").textContent =
        new Date().toLocaleString("id-ID");

    const s = document.getElementById("strukList");
    s.innerHTML = "";

    products.forEach(p => {
        const nama = document.createElement("div");
        nama.textContent = p.nama;

        const detail = document.createElement("div");
        detail.className = "struk-item";

        const kiri = document.createElement("span");
        kiri.textContent = p.qty + " " + p.satuan +
            " x " + rupiah(p.harga);

        const kanan = document.createElement("span");
        kanan.textContent = rupiah(p.subtotal);

        detail.append(kiri,kanan);
        s.append(nama,detail);
    });

    document.getElementById("strukTotal").textContent = rupiah(total);
}

// DOWNLOAD STRUK PNG
function downloadStruk(){
    if(!window.html2canvas){
        alert("Fitur PNG gagal dimuat. Periksa koneksi internet.");
        return;
    }

    html2canvas(document.getElementById("areaStruk")).then(canvas => {
        const a = document.createElement("a");
        a.href = canvas.toDataURL("image/png");
        a.download = "struk-toko-deaca.png";
        a.click();
    }).catch(() => alert("Gagal membuat gambar struk."));
}

// SIMPAN TRANSAKSI
function simpanTransaksi(){
    if(products.length === 0){
        alert("Keranjang masih kosong!");
        return;
    }

    const history = JSON.parse(localStorage.getItem("history")) || [];

    history.push({
        tanggal: new Date().toLocaleString("id-ID"),
        items: products.map(p => ({...p})),
        total
    });

    localStorage.setItem("history",JSON.stringify(history));
    alert("Transaksi berhasil disimpan!");
}

// TAMPILKAN HISTORY
function lihatHistory(){
    document.getElementById("kasirPage").classList.add("hidden");
    document.getElementById("strukPage").classList.add("hidden");
    document.getElementById("historyPage").classList.remove("hidden");

    const history = JSON.parse(localStorage.getItem("history")) || [];
    const list = document.getElementById("historyList");
    list.innerHTML = "";

    if(history.length === 0){
        list.textContent = "Belum ada transaksi.";
        return;
    }

    [...history].reverse().forEach((d,index) => {
        const originalIndex = history.length - 1 - index;

        const div = document.createElement("div");
        div.className = "product";

        const info = document.createElement("div");
        const tanggal = document.createElement("strong");
        tanggal.textContent = d.tanggal;

        const nilai = document.createElement("div");
        nilai.textContent = "Total: Rp " + rupiah(d.total);

        const rincian = document.createElement("div");
        rincian.className = "small";
        rincian.textContent = d.items.map(item =>
            item.nama + " (" + item.qty + " " +
            (item.satuan || "Pcs") + ")"
        ).join(", ");

        const pakai = document.createElement("button");
        pakai.textContent = "Pakai Lagi";
        pakai.onclick = () => pakaiHistory(originalIndex);

        info.append(tanggal,nilai,rincian);
        div.append(info,pakai);
        list.appendChild(div);
    });
}

// PAKAI HISTORY LAGI
function pakaiHistory(i){
    const history = JSON.parse(localStorage.getItem("history")) || [];
    const data = history[i];

    if(!data) return;

    products = data.items.map(item => ({
        nama: item.nama,
        harga: Number(item.harga),
        qty: Number(item.qty),
        satuan: satuanList.includes(item.satuan) ? item.satuan : "Pcs",
        subtotal: Math.round(Number(item.harga) * Number(item.qty))
    }));

    hitungTotal();
    updateKeranjang();
    kembali();
}

// KEMBALI KE KASIR
function kembali(){
    document.getElementById("kasirPage").classList.remove("hidden");
    document.getElementById("strukPage").classList.add("hidden");
    document.getElementById("historyPage").classList.add("hidden");
}
</script>

</body>
</html>
